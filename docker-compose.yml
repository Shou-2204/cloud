# Configuration des services d'infrastructure pour le développement local
# Expose les ports standards sur l'interface de boucle locale 127.0.0.1
# Assure la persistance des données de la base MySQL via un volume Docker


services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: www-redis-1
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: www-minio-1
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: www-meilisearch-1
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey

  stripe:
    image: stripe/stripe-cli:latest
    command: listen --forward-to https://web.shouphotobooth:44443/stripe/webhook --api-key ${STRIPE_SECRET}
    network_mode: "host" 
    profiles: ["stripe"]
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  minio_data:
