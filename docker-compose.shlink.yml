services:
  shlink:
    image: shlinkio/shlink:stable
    container_name: cloud-shlink-1
    restart: unless-stopped
    environment:
      - DEFAULT_DOMAIN=localhost:8081
      - IS_HTTPS_ENABLED=false
      - GEOLITE_LICENSE_KEY=${GEOLITE_LICENSE_KEY:-}
      - DB_DRIVER=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-Topuser123}
      - DB_HOST=laravel-mysql-1
      - DB_NAME=shlink
      - SHELL_VERBOSITY=3
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - laravel_default

  shlink-web-client:
    image: shlinkio/shlink-web-client:stable
    container_name: cloud-shlink-web-1
    restart: unless-stopped
    environment:
      - SHLINK_SERVER_URL=http://localhost:8081
      - SHLINK_SERVER_API_KEY=e143acb6-a5c7-4528-a389-c9d07789e29c
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - laravel_default

networks:
  laravel_default:
    external: true
